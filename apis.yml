name: UpSmith
description: UpSmith is a Dallas, Texas-based company backed by a16z that builds AI
  agents for home services and skilled trades businesses (HVAC, plumbing, electrical).
  Its platform texts customers to confirm appointments, follows up on cold estimates,
  responds to inbound leads around the clock, and reactivates dormant customers,
  syncing customer records, job details, and booking data with ServiceTitan through
  ServiceTitan's official APIs. UpSmith consumes partner APIs (a native ServiceTitan
  marketplace integration) but does not publish a public developer API of its own.
